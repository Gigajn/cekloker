[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cekloker-api"
version = "0.1.0"
description = "FastAPI + worker CekLoker (Fase 1-lanjutan): daftar lowongan aktif + skor Green/Red Flag perusahaan."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "psycopg2-binary>=2.9",  # driver PostgreSQL (produksi / docker-compose)
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "httpx>=0.27",  # TestClient FastAPI butuh httpx
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
