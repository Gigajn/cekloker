# Skeleton Fase 0 — service diisi penuh di Fase 1
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: loker_greenflag
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: changeme
      MINIO_ROOT_PASSWORD: changeme
    ports:
      - "9000:9000"
    volumes:
      - miniodata:/data

  # api: (Fase 1)
  #   build: ../apps/api
  #   env_file: ../.env
  #   depends_on: [postgres, redis]
  # worker: (Fase 1) scraper worker, sama image dengan api
  # web: (Fase 1)
  #   build: ../apps/web

volumes:
  pgdata:
  miniodata:
